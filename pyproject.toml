[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-mean-reversion-trader"
version = "0.1.0"
description = "Deterministic Taiwan stock mean-reversion research and execution engine"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "pydantic>=2.7",
  "PyYAML>=6", "SQLAlchemy>=2", "pyarrow>=16", "matplotlib>=3.8",
  "plotly>=5.22", "rich>=13.7", "typer>=0.12", "APScheduler>=3.10",
  "python-dotenv>=1", "yfinance>=0.2.54"
]

[project.optional-dependencies]
live = ["shioaji>=1.2"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
trader = "trader.__main__:app"

[tool.setuptools.packages.find]
include = ["trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

