strategy:
  universe:
    minimum_history_days: 120
    minimum_price: 10
    maximum_price: 1000
    minimum_avg_daily_value_20d: 30000000
    minimum_avg_daily_volume_shares_20d: 300000
    exclude_disposition: true
    exclude_full_cash_delivery: true
    exclude_suspended: true
    exclude_new_listing_days: 120
    exclude_etf: true
    exclude_etn: true
    exclude_warrant: true
    exclude_ky: false
    max_missing_data_ratio: 0.01
  oscillation:
    lookback_days: 60
    atr_period: 14
    minimum_atr_pct: 0.025
    ideal_atr_low_pct: 0.04
    ideal_atr_high_pct: 0.06
    maximum_atr_pct: 0.12
    zigzag_threshold: 0.05
    minimum_swings: 4
    minimum_direction_changes: 6
    efficiency_ratio_period: 60
    maximum_efficiency_ratio: 0.35
    minimum_score: 65
  low_zone:
    lookback_days: 60
    max_price_position: 0.25
    max_price_percentile: 0.25
    rsi_period: 14
    rsi_minimum: 20
    rsi_maximum: 45
    bollinger_period: 20
    bollinger_std: 2
    bollinger_max_position: 0.35
    minimum_score: 65
  mean_reversion:
    target_return: 0.10
    horizon_days: 40
    minimum_probability: 0.65
    minimum_historical_events: 20
    event_cooldown_days: 10
    beta_prior_alpha: 5
    beta_prior_beta: 5
    dynamic_tp_minimum_trades: 30
  regime:
    maximum_buy_risk_score: 40
    thesis_break_score: 75
    thesis_break_immediate_score: 90
    thesis_break_confirmation_days: 2
  ranking:
    minimum_final_score: 70
  portfolio:
    max_positions: 8
    max_position_weight: 0.15
    minimum_position_weight: 0.05
    cash_reserve_ratio: 0.10
    max_new_positions_per_day: 3
  execution:
    model: NEXT_DAY_OPEN
    next_day_execution: true
    buy_window_start: "09:15"
    buy_window_end: "09:30"
    max_buy_price_deviation: 0.003
    buy_slippage: 0.001
    sell_slippage: 0.001
    scenarios:
      OPTIMISTIC: {buy_slippage: 0.0005, sell_slippage: 0.0005, touch_adverse: 0.0, volume_fraction: 0.10}
      BASE: {buy_slippage: 0.001, sell_slippage: 0.001, touch_adverse: 0.0, volume_fraction: 0.05}
      CONSERVATIVE: {buy_slippage: 0.002, sell_slippage: 0.003, touch_adverse: 0.0015, volume_fraction: 0.02}
  take_profit:
    dynamic: true
    fallback: 0.10
    candidates: [0.05, 0.08, 0.10, 0.12, 0.15, 0.20]
    minimum: 0.05
    maximum: 0.20
    minimum_historical_success_probability: 0.60
  stop_loss:
    fixed_percentage_enabled: false
  holding:
    max_days: 60
    extension_days: 30
    absolute_max_days: 90
  averaging_down:
    enabled: false
  account_risk:
    daily_equity_drop_pause: 0.08
    maximum_strategy_drawdown: 0.25
  market_regime:
    crash_mode_position_multiplier: 0.50
backtest:
  initial_capital_twd: 100000
  start_date: "2019-01-01"
  seed: 42
research:
  dataset_version: "tw_equity_daily_v2_20260821"
  warmup: ["2018-01-01", "2018-12-31"]
  development: ["2019-01-01", "2021-12-31"]
  validation: ["2022-01-01", "2023-12-31"]
  final_oos: ["2024-01-01", null]
  minimum_training_trades: 50
  minimum_test_fold_trades: 30
